apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-deployment
  namespace: lanchonete-pagamento
  labels:
    app: ds-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ds-mongo
  template:
    metadata:
      labels:
        app: ds-mongo
    spec:
      containers:
        - name: ds-mongo
          image: mongo:latest
          imagePullPolicy: "IfNotPresent"
          env:
            - name: MONGO_DB
              valueFrom:
                configMapKeyRef:
                  name: mongo-configmap
                  key: mongo-dbname
            - name: MONGO_USER
              valueFrom:
                configMapKeyRef:
                  name: mongo-configmap
                  key: mongo_user
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: password
          volumeMounts:
            - mountPath: /var/lib/mongo/data
              name: mongo-db
      volumes:
        - name: mongo-db
          persistentVolumeClaim:
            claimName: mongo-pv-claim