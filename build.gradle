plugins {
	id 'org.jetbrains.kotlin.jvm' version '1.9.25'
	id 'org.jetbrains.kotlin.plugin.spring' version '1.9.25'
	id 'org.springframework.boot' version '3.4.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id "org.sonarqube" version "6.0.1.5171"
}

group = 'br.com.fiap.lanchonete'
version = '0.0.3'

ext {
	springdocVersion = "2.3.0"
	springCloudVersion = "2024.0.0"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	implementation 'org.springframework.cloud:spring-cloud-starter-bootstrap'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
	implementation 'org.jetbrains.kotlin:kotlin-reflect'
	implementation 'io.github.microutils:kotlin-logging-jvm:3.0.5'
	implementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.4.12'
	implementation "org.springframework.boot:spring-boot-starter-validation"
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
	implementation "org.springdoc:springdoc-openapi-starter-common:${springdocVersion}"
	implementation "org.springframework.retry:spring-retry:2.0.11"
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
	testImplementation("com.ninja-squad:springmockk:4.0.2") {
		exclude module: 'mockito-core'
	}
	testImplementation 'io.cucumber:cucumber-java:7.19.0'
	testImplementation 'io.cucumber:cucumber-spring:7.20.0'
	testImplementation 'io.cucumber:cucumber-junit:7.19.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

kotlin {
	compilerOptions {
		freeCompilerArgs.addAll '-Xjsr305=strict'
	}
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

jacocoTestReport {
	reports {
		xml.required = true
		csv.required = true
		html.required = true
	}

	classDirectories.setFrom(files(classDirectories.files.collect {
		fileTree(dir: it, exclude: [
									'**/br/com/fiap/lanchonete/pagamento/adapters/config/**',
									'**/br/com/fiap/lanchonete/pagamento/adapters/input/rest/ErrorController.class',
									'**/br/com/fiap/lanchonete/pagamento/core/exceptions/**',
									'**/br/com/fiap/lanchonete/pagamento/core/dto/**',
									'**/br/com/fiap/lanchonete/pagamento/PagamentoApplication.class'])

	}))
}

sonar {
	properties {
		property "sonar.projectKey", "tiagogn_lanchonete-api-pagamento"
		property "sonar.organization", "fiap-lanchonete-soat8"
		property "sonar.host.url", "https://sonarcloud.io"
		property "sonar.exclusions", "**/build/**," +
				"**/test/**,**/src/test/**," +
				"**/src/main/resources/**," +
				"**/src/main/kotlin/br/com/fiap/lanchonete/pagamento/adapters/config/**," +
				"**/src/main/kotlin/br/com/fiap/lanchonete/pagamento/adapters/input/rest/request/**," +
				"**/src/main/kotlin/br/com/fiap/lanchonete/pagamento/adapters/input/rest/response/**," +
				"src/main/kotlin/br/com/fiap/lanchonete/pagamento/adapters/input/rest/ErrorController.kt," +
				"**/src/main/kotlin/br/com/fiap/lanchonete/pagamento/adapters/output/persistence/**"
		property "sonar.coverage.exclusions", "**/build/**," +
				"**/test/**,**/src/test/**," +
				"**/src/main/resources/**," +
				"**/src/main/kotlin/br/com/fiap/lanchonete/pagamento/adapters/config/**," +
				"**/src/main/kotlin/br/com/fiap/lanchonete/pagamento/adapters/input/rest/request/**," +
				"**/src/main/kotlin/br/com/fiap/lanchonete/pagamento/adapters/input/rest/response/**," +
				"src/main/kotlin/br/com/fiap/lanchonete/pagamento/adapters/input/rest/ErrorController.kt," +
				"**/src/main/kotlin/br/com/fiap/lanchonete/pagamento/adapters/output/persistence/**"
	}
}