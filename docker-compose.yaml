volumes:
    mongo_data:

services:
  mongodb:
    image: mongo:latest
    ports:
      - 27017:27017
    environment:
        - MONGO_INITDB_ROOT_USERNAME=pagamento_user
        - MONGO_INITDB_ROOT_PASSWORD=pagamento_password
        - MONGO_INITDB_DATABASE=lanchonete
    volumes:
        - mongo_data:/data/db